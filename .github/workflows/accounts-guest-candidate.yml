name: Verify Spark accounts and guest identity
on:
  push:
    branches: [feat/accounts-guest]
  workflow_dispatch:
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VARIANT: debug
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false
      - name: Test, lint and build once
        env:
          UI_CHECK: true
        run: |
          UI_TASKS=()
          if [ "$UI_CHECK" = true ]; then UI_TASKS=(:app:assembleDebugAndroidTest); fi
          # Maven Central can intermittently return HTTP 429 on fresh runners.
          # Retry only that transient infrastructure error, not compilation or tests.
          for attempt in 1 2 3; do
            if gradle --no-daemon -PuiTestBuildType=debug ":app:test${VARIANT^}UnitTest" ":app:lint${VARIANT^}" ":app:assemble${VARIANT^}" "${UI_TASKS[@]}" > build-attempt.log 2>&1; then
              cat build-attempt.log
              break
            fi
            cat build-attempt.log
            if ! grep -Eq 'status code 429|Too Many Requests' build-attempt.log || [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 12))
          done
      - name: Verify APK and create update metadata
        run: |
          mkdir -p dist
          VERSION=$(python3 -c 'import json,os; print(json.load(open("app/build/outputs/apk/"+os.environ["VARIANT"]+"/output-metadata.json"))["elements"][0]["versionName"])')
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          cp "app/build/outputs/apk/$VARIANT/app-$VARIANT.apk" "dist/Speakivra-v$VERSION-$VARIANT.apk"
          RELEASE_FLAG=()
          if [ "$VARIANT" = release ]; then RELEASE_FLAG=(--release); fi
          python3 scripts/apk_metadata.py "dist/Speakivra-v$VERSION-$VARIANT.apk" dist "${RELEASE_FLAG[@]}"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Start isolated Firebase emulators and check ownership rules
        run: |
          npm ci --prefix tests/firestore
          npx -y firebase-tools@15.37.0 emulators:start --only auth,firestore --project demo-speakivra-spark > firebase-emulators.log 2>&1 &
          echo "$!" > firebase-emulators.pid
          python3 - <<'PYREADY'
          import time, urllib.request, urllib.error
          def ready(url):
              try:
                  with urllib.request.urlopen(url, timeout=2) as response: return response.status < 500
              except urllib.error.HTTPError as error: return error.code < 500
              except Exception: return False
          for attempt in range(150):
              if ready("http://127.0.0.1:8080/") and ready("http://127.0.0.1:9099/emulator/v1/projects/demo-speakivra-spark/config"): break
              time.sleep(1)
          else: raise SystemExit("Firebase Auth/Firestore endpoints did not become ready")
          PYREADY
          FIRESTORE_EMULATOR_HOST=127.0.0.1:8080 npm --prefix tests/firestore test
      - name: Enable emulator acceleration for UI review
        if: true
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Review approved screens on Android emulator
        if: true
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none -grpc 8554
          disable-animations: true
          script: |
            adb shell wm size 1080x2340
            adb shell wm density 420
            adb install -r dist/*.apk
            adb shell pm grant com.nghialcvn.speakivra android.permission.POST_NOTIFICATIONS
            adb install -r -t app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell settings get secure voice_recognition_service | tee ui-recognition-provider.txt
            adb shell am instrument -w -e class com.nghialcvn.speakivra.AdvancedCurriculumFlowTest,com.nghialcvn.speakivra.GuestLinkReminderUiTest,com.nghialcvn.speakivra.AccountDraftFlowTest,com.nghialcvn.speakivra.FreshInstallLearnerTest,com.nghialcvn.speakivra.ApprovedUiTest#approvedDiamondRewardsAndResume,com.nghialcvn.speakivra.SparkAccountIntegrationTest com.nghialcvn.speakivra.test/androidx.test.runner.AndroidJUnitRunner | tee ui-test-output.txt
            mkdir -p ui-review
            adb pull /sdcard/Android/data/com.nghialcvn.speakivra/files/ui-screenshots ui-review/
            python3 -c 'from pathlib import Path; import re; s=Path("ui-test-output.txt").read_text(); m=re.search(r"OK \((\d+) tests?\)", s); assert m and int(m.group(1)) >= 18 and "FAILURES!!!" not in s, s'
      - name: Upload UI review screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Speakivra-ui-review
          path: |
            ui-review/**
            ui-test-output.txt
            firebase-emulators.log
            ui-recognition-provider.txt
            real-speech-provider-probe.txt
            app/build/reports/tests/**
            app/build/test-results/**
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: Speakivra-${{ env.VARIANT }}-verification
          path: dist/*
          if-no-files-found: error
          retention-days: 7
